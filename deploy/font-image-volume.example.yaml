# Pod-spec fragment. Build the app and nginx images and replace the image digest.
# The two containers share a network namespace; nginx proxies dynamic requests to port 3000.
spec:
  containers:
    - name: imageslide-converter
      image: registry.example.com/imageslide/converter:YOUR_VERSION
      ports:
        - containerPort: 3000
    - name: nginx
      image: registry.example.com/imageslide/frontend:YOUR_VERSION
      ports:
        - containerPort: 80
      volumeMounts:
        - name: google-fonts
          mountPath: /opt/imageslide-fonts
          readOnly: true
  volumes:
    - name: google-fonts
      image:
        reference: registry.example.com/imageslide/google-fonts@sha256:REPLACE_WITH_IMAGE_DIGEST
        pullPolicy: IfNotPresent
