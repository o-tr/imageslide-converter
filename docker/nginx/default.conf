map $http_x_forwarded_proto $external_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Both locations read directly from the read-only font image volume.
    location = /deckcraft-fonts/catalog.json {
        alias /opt/imageslide-fonts/catalog.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /deckcraft-fonts/fonts/ {
        alias /opt/imageslide-fonts/fonts/;
        types { font/ttf ttf; font/otf otf; }
        default_type application/octet-stream;
        disable_symlinks on;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /deckcraft-fonts/ { return 404; }

    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /deckcraft/ { try_files $uri =404; }
    location ^~ /image-slide/ { try_files $uri =404; }
    location = /icon.png { try_files $uri =404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $external_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
