name: fonts-image

# Publishes the Google Fonts catalog image that Kubernetes mounts as an image
# volume for nginx (see docs/deckcraft-poc.md). Its content is fixed by the
# google/fonts commit pinned in docker/fonts/Dockerfile and the tag is that
# commit, so the image is built only when the tag is missing from the registry.
# Release tags and manual runs both just make sure it exists; reference the
# digest from the job summary in the Deployment.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "**"
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-google-fonts

jobs:
  ensure-fonts-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read pinned google/fonts revision
        id: rev
        run: |
          rev=$(sed -n 's/^ARG GOOGLE_FONTS_REV=//p' docker/fonts/Dockerfile)
          test -n "$rev"
          echo "short=${rev:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image already exists
        id: exists
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.rev.outputs.short }}
        run: |
          if digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push font image
        id: push
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/fonts/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.rev.outputs.short }}

      - name: Show the image digest
        env:
          DIGEST: ${{ steps.exists.outputs.found == 'true' && steps.exists.outputs.digest || steps.push.outputs.digest }}
        run: |
          echo "Font image: ${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
