name: fonts-image

# Publishes the Google Fonts catalog image that Kubernetes mounts as an image
# volume for nginx (see docs/deckcraft-poc.md). It is large and changes rarely,
# so it only builds when its inputs change or when run by hand. Reference the
# digest shown in the job summary from the Deployment.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - docker/fonts/**
      - scripts/create-google-font-pack.py
      - .github/workflows/fonts-image.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-google-fonts

jobs:
  build-and-push-fonts-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read pinned google/fonts revision
        id: rev
        run: |
          rev=$(sed -n 's/^ARG GOOGLE_FONTS_REV=//p' docker/fonts/Dockerfile)
          test -n "$rev"
          echo "short=${rev:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push font image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/fonts/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.rev.outputs.short }}

      - name: Show the image digest
        run: |
          echo "Font image: ${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
