name: release

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "**"
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Layer cache shared by every release. Runners start empty, so without it the
  # DeckCraft wasm stage (rust toolchain + trunk + build, the bulk of the job)
  # reruns even though vendor/deckcraft rarely changes. mode=max also exports the
  # intermediate stages, which is what makes the deckcraft stage reusable.
  CACHE_REF: ghcr.io/${{ github.repository }}-buildcache:release

jobs:
  build-container-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The Dockerfile builds the DeckCraft editor from vendor/deckcraft.
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag name
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max,image-manifest=true,oci-mediatypes=true

      # nginx serves the static assets and the font image volume, and proxies
      # everything else to the app container, so it ships alongside the app.
      - name: Build and push frontend (nginx) image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx/Dockerfile
          build-args: |
            APP_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG_NAME }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ env.TAG_NAME }}
